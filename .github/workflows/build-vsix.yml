name: Build VSIX (fork)

on:
  push:
    branches:
      - build-vsix-github-actions
      - fix-git-terminal-timeouts
      - fix-configurable-chat-duration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vsix:
    name: Compile, test and package VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint changed sources
        run: pnpm --filter m365-copilot-vscode exec oxlint tools/terminal.ts src/participant.ts src/participantPrompts.ts

      - name: Build project
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Package VS Code extension
        run: pnpm package:vscode

      - name: Upload downloadable VSIX
        uses: actions/upload-artifact@v4
        with:
          name: m365-copilot-vscode-configurable-duration
          path: releases/vscode/*.vsix
          if-no-files-found: error
          retention-days: 14
