name: Full M365 agent

on:
  push:
    branches: [fix-full-m365-agent, fix-m365-agent-noop-attachments]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-m365-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/fix-full-m365-agent' || github.ref == 'refs/heads/fix-m365-agent-noop-attachments'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Verify complete base and original controls
        run: node extensiones/vscode/test/base-parity.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Lint changed production sources
        run: pnpm --filter m365-copilot-vscode exec oxlint src/locales/en.ts src/locales/es.ts src/subagentCore.ts src/participant.ts src/attachmentText.ts src/participantPrompts.ts src/transcript.ts tools/replaceText.ts tools/terminal.ts tools/terminalOutput.ts
      - run: pnpm build
      - run: pnpm test
      - run: pnpm package:vscode
      - name: Recheck preservation after build
        run: node extensiones/vscode/test/base-parity.mjs
      - name: Verify tracked source remains unchanged during build
        run: git diff --exit-code
      - name: Preserve exact source and changes
        run: |
          mkdir -p /tmp/full-m365-evidence
          git archive --format=zip --prefix=M365CopilotVSCode/ HEAD > /tmp/full-m365-evidence/M365CopilotVSCode-source.zip
          git rev-parse HEAD > /tmp/full-m365-evidence/SOURCE_COMMIT.txt
          git diff c062fe6a5d032068600f909d17ea36cd2dae663c HEAD -- extensiones/vscode > /tmp/full-m365-evidence/full-m365-3.0.6.patch
          sha256sum releases/vscode/*.vsix > releases/vscode/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: full-m365-source
          path: /tmp/full-m365-evidence/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: full-m365-vsix
          path: releases/vscode/*
          if-no-files-found: error
          retention-days: 14
